version: "3.8"

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: game_schedule_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-game_schedule}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FastAPI 后端 ==========
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: game_schedule_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ENV: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    expose:
      - "8000"

  # ========== Nginx（前端 + 反向代理） ==========
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: game_schedule_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local
